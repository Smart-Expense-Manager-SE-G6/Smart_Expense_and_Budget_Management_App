# S3-11: every pull request and every push to main runs the full regression suite (STP section 5).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# On a pull request only the newest push matters, so older runs are cancelled.
# On main every merge commit gets its own group (its run id), so no run is ever
# cancelled or dropped from the queue, even when several PRs are merged at once.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DJANGO_SECRET_KEY: ci-only-not-a-secret
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  POSTGRES_DB: smart_expense
  POSTGRES_USER: smart_expense
  POSTGRES_PASSWORD: ci-password
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  LOG_LEVEL: WARNING

jobs:
  backend:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_expense
          POSTGRES_USER: smart_expense
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smart_expense"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt coverage==7.6.10

      - name: Audit Python dependencies
        run: pip install -q pip-audit && pip-audit -r requirements.txt

      - name: System check
        run: python manage.py check

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with line and branch coverage
        run: coverage run manage.py test --verbosity 1

      - name: Coverage report (fails under 80%)
        run: |
          coverage json -q -o coverage.json
          coverage html -q -d coverage-html
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          t = json.load(open("coverage.json"))["totals"]
          lines = 100 * t["covered_lines"] / t["num_statements"]
          branches = 100 * t["covered_branches"] / t["num_branches"]
          print("## Backend coverage\n")
          print("| Measure | Covered | Total | % |\n|:--|--:|--:|--:|")
          print(f"| Lines | {t['covered_lines']} | {t['num_statements']} | {lines:.1f}% |")
          print(f"| Branches | {t['covered_branches']} | {t['num_branches']} | {branches:.1f}% |")
          print(f"| **Combined** | | | **{t['percent_covered']:.1f}%** |")
          EOF
          coverage report

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage-html
            backend/coverage.json

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # Audits the packages that ship in the app; build tooling (Vite and its
      # dependencies) never reaches users. See docs/deviations.md T-10.
      - name: Audit JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build

  api:
    name: API tests (Postman)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_expense
          POSTGRES_USER: smart_expense
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smart_expense"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Start the API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --verbosity 0
          python manage.py runserver 127.0.0.1:8000 > ../runserver.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health/ && exit 0; sleep 1; done
          cat ../runserver.log; exit 1

      - name: Run the Postman collection
        run: npx --yes newman@6.2.1 run tests/postman_collection.json --env-var base_url=http://127.0.0.1:8000

  e2e:
    name: End-to-end tests (Selenium)
    runs-on: ubuntu-latest
    needs: [backend, frontend, api]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          # Compose interpolation uses the workflow-level ci-password for db,
          # so the backend env_file must use the same password.
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/' .env
          # The suite registers a new user per test; the default sign-up and login limits
          # (5 and 10 per minute per address, a security feature) would throttle it.
          sed -i 's#^REGISTER_RATE_LIMIT=.*#REGISTER_RATE_LIMIT=1000/min#; s#^LOGIN_RATE_LIMIT=.*#LOGIN_RATE_LIMIT=1000/min#' .env
      - name: Start application
        run: docker compose up -d --build
      - name: Wait for frontend and API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:5174/ && curl -sf http://localhost:8001/api/v1/health/ && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Selenium suite
        run: python -m pip install -r tests/e2e/requirements.txt
      - name: Run Selenium journeys
        run: pytest tests/e2e --html=tests/e2e/artifacts/report.html --self-contained-html
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-e2e-artifacts
          path: tests/e2e/artifacts
      - name: Stop application
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ CD
  # Continuous delivery: once every test job has passed, build the production
  # images, deploy the real production stack (gunicorn, Caddy HTTPS, PostgreSQL,
  # scheduler, backups) on the runner, and smoke-test it end to end. On pull
  # requests this is a staging check; on main the tested images are published to
  # GitHub Container Registry, so every commit on main is a deployable release.
  deliver:
    name: Deploy to staging and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend, api]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/smart-expense-manager-se-g6
    steps:
      - uses: actions/checkout@v4

      - name: Deploy the production stack (same script as the demo)
        run: bash deploy/local-demo.sh

      - name: Smoke test the deployment over HTTPS
        run: bash deploy/smoke_test.sh https://localhost --insecure

      - name: Restore rehearsal on the deployed stack
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm -T backup /scripts/rehearse_restore.sh

      - name: Show logs if the deployment failed
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail 200

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sha="${GITHUB_SHA::7}"
          for image in backend web backup; do
            for tag in "$sha" main; do
              docker tag "smart-expense-$image:prod" "$REGISTRY/smart-expense-$image:$tag"
              docker push -q "$REGISTRY/smart-expense-$image:$tag"
            done
          done
          {
            echo "## Published release ($sha)"
            echo "Deployed and smoke-tested on the runner, then published:"
            for image in backend web backup; do echo "- \`$REGISTRY/smart-expense-$image:$sha\` (also \`:main\`)"; done
            echo
            echo "Run it: \`deploy/local-demo.sh release $sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the deployment
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod down -v
