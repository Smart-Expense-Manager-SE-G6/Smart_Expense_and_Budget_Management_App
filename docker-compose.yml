
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
      - ./logs:/var/log/app
      - ./backups:/backups:ro
      - monitoring-state:/monitoring:ro
    ports:
      - "8001:8000"
    environment:
      POSTGRES_HOST: db
      APP_LOG_DIR: /var/log/app
      MONITORING_STATE_DIR: /monitoring
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    depends_on:
      - backend

  # Daily scheduled backups (NFR10), plus the backup and restore tools (FR22).
  # See "Backups" in README.md.
  #   docker compose run --rm backup /scripts/backup.sh
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      BACKUP_DIR: /backups
      MEDIA_DIR: /media
      MONITORING_STATE_DIR: /monitoring
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
      - ./backend/private_media:/media
      - monitoring-state:/monitoring
    entrypoint: ["sh"]
    command: ["/scripts/schedule_backups.sh"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /backups/LATEST -mmin -1500 | grep -q ."]
      interval: 1h
      start_period: 10m

  # FR12 budget rollover and FR6 recurring expenses, daily
  budget-scheduler:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MONITORING_STATE_DIR: /monitoring
    volumes:
      - ./backend:/app
      - monitoring-state:/monitoring
    command: ["sh", "scripts/run_budget_scheduler.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  monitoring-state:
